<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amandeep | Portfolio</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="theme-controls">
      <button id="theme-toggle" title="Toggle Theme">
        <span class="icon">🌓</span>
      </button>
    </nav>

    <header class="brand-header reveal-fade">
      <h1 id="user-name">AMANDEEP</h1>
      <div id="profile-container"></div>
    </header>

    <main>
      <section id="about" class="reveal-left" data-section="about"></section>

      <section id="projects-grid" class="reveal-right">
        <h2>Featured Projects</h2>
        <div id="projects-container" class="grid-layout"></div>
      </section>

      <section id="future-plans" class="reveal-fade">
        <h2>Future Roadmap</h2>
        <div id="future-container"></div>
      </section>

      <section id="games" class="reveal-left">
        <h2>Arcade</h2>
        <p>
          Bored? Play <a href="games.html">Tic-Tac-Toe</a> or
          <a href="#">Snake</a>.
        </p>
      </section>
    </main>

    <div class="fluid-wave"></div>

    <script src="script.js"></script>
  </body>
</html>
